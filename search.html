<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <title>Search Guides — HelpDesk Starter</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <section class="page-header">
      <div class="container">
        <h1>Search troubleshooting guides</h1>
        <form id="searchPageForm">
          <div class="search-box">
            <label for="searchPageInput" class="sr-only">Search troubleshooting guides</label>
            <input type="text" id="searchPageInput" placeholder="e.g. 'printer offline' or 'forgot password'" autocomplete="off">
            <button type="submit">Search</button>
          </div>
        </form>
        <div class="filter-bar">
          <label class="sr-only" for="searchCategoryFilter">Filter by category</label>
          <select id="searchCategoryFilter" class="select-field"></select>
          <label class="sr-only" for="searchDifficultyFilter">Filter by difficulty</label>
          <select id="searchDifficultyFilter" class="select-field">
            <option value="all">All difficulty levels</option>
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Advanced</option>
          </select>
        </div>
      </div>
    </section>
    <section class="section">
      <div class="container">
        <h2 id="searchHeading" class="mt-0">All guides</h2>
        <div class="card-grid" id="searchGrid"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data/categories.js"></script>
  <script src="assets/js/data/guides.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/components/footer.js"></script>
  <script src="assets/js/components/search-widget.js"></script>
  <script src="assets/js/render-search.js"></script>
</body>
</html>
