<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/base.css">
  <link rel="stylesheet" href="assets/css/components.css">
  <link rel="stylesheet" href="assets/css/layout.css">
  <link rel="stylesheet" href="assets/css/premium.css">
  <title>Contact — HelpDesk Starter</title>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header id="site-header" class="site-header"></header>
  <main id="main">
    <section class="page-header">
      <div class="container">
        <p class="breadcrumbs"><a href="index.html">Home</a> / <span aria-current="page">Contact</span></p>
        <h1>Get in touch</h1>
        <p>Have a question a guide didn't answer, or need hands-on help? Send us a message.</p>
      </div>
    </section>
    <section class="section">
      <div class="container guide-layout">
        <article>
          <form id="contactForm" class="stack" aria-label="Contact form">
            <div class="form-field"><label for="contactName">Your name</label><input type="text" id="contactName" name="name" required></div>
            <div class="form-field"><label for="contactEmail">Email address</label><input type="email" id="contactEmail" name="email" required></div>
            <div class="form-field"><label for="contactMessage">What's going on?</label><textarea id="contactMessage" name="message" required></textarea></div>
            <button type="submit" class="btn btn-primary">Send message</button>
            <p id="formStatus" role="status" style="color:var(--color-text-muted);font-size:var(--fs-sm);"></p>
          </form>
        </article>
        <aside class="guide-sidebar" aria-label="Contact details">
          <div class="card"><h3>Contact details</h3><div id="contactInfo"></div></div>
          <div class="card"><h3>Hours</h3><table class="hours-table" id="hoursTable"></table></div>
        </aside>
      </div>
    </section>
  </main>
  <footer id="site-footer" class="site-footer"></footer>
  <script src="assets/js/config.js"></script>
  <script src="assets/js/data/categories.js"></script>
  <script src="assets/js/data/guides.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/components/header.js"></script>
  <script src="assets/js/components/footer.js"></script>
  <script src="assets/js/components/search-widget.js"></script>
  <script src="assets/js/render-contact.js"></script>
</body>
</html>
